name = "herdr-voice"
version = "1.0.0-alpha.1"
description = "Real-time TTS Voice Plugin for Herdr agents"
author = "Thomas Gauthier"

[[actions]]
id = "toggle"
label = "Voice Toggle"
shortcut = "Ctrl+v"
description = "Toggle active pane voice synthesis on/off"
handler = "dist/index.js:handleToggle"

[[events]]
name = "pane.agent_status_changed"
handler = "dist/index.js:onAgentStatusChanged"

[[events]]
name = "pane.focused"
handler = "dist/index.js:onPaneFocused"
