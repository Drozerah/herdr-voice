# ==============================================================================
# Declarative Configuration File: herdr-plugin.toml
# Validated against IETF JSON Schema (Draft 2020-12): schemas/herdr-plugin.schema.json
# ==============================================================================

[plugin]
name = "herdr-voice" # Plugin name identifier
version = "1.0.0-alpha.1" # Plugin SemVer version string
enabled = true # Master toggle switch (true = active, false = disabled without uninstalling)

[server]
endpoint = "http://127.0.0.1:8888/v1/audio/speech" # Target TTS inference server endpoint URL
api_key = "" # API authorization key for secured endpoints (e.g. sk-...)
model = "mlx-kokoro" # TTS model identifier (e.g., mlx-kokoro, tts-1, tts-1-hd)
voice = "Thomas" # Speaker voice identifier (e.g., Thomas, alloy, echo, fable)
speed = 1.0 # Speech speed playback rate multiplier (range: 0.25 to 4.0, default: 1.0)
response_format = "aiff" # Binary audio output stream format (aiff, pcm, mp3, opus, aac, flac)

# Security Guardrails & AI Agent Financial DoW Protection
max_input_length = 1000 # Maximum characters per TTS inference payload to prevent token runaway (range: 50 to 50000)
max_requests_per_minute = 10 # Automatic circuit breaker limiting maximum requests per minute (range: 1 to 120)
# suppress_lan_warning = false # Set to true to suppress visual Toast UI security alerts for unencrypted LAN HTTP endpoints

[audio]
sample_rate = 24000 # Audio sampling rate frequency in Hz (e.g., 24000 Hz for Kokoro-82M)
channels = 1 # Number of audio channels (1 = Mono, 2 = Stereo, range: 1 to 8)
high_water_mark = 16384 # RAM backpressure limit in bytes (16 KB) for @audio/speaker playback

# Custom HTTP headers for third-party inference servers
[extra_headers]
# "OpenAI-Organization" = "org-123456789" # Custom header key-value pair example

# Custom JSON parameters for third-party inference servers (Standard OpenAI SDK extra_body)
[extra_body]
# stability = 0.75 # Custom JSON body field override example
