id = "herdr-voice"
name = "Herdr Voice Plugin"
version = "1.0.0"
min_herdr_version = "0.7.0"
description = "Real-time TTS Voice Plugin for Herdr agents"
platforms = ["macos"]

[[actions]]
id = "toggle-voice-proto"
title = "🔊 Toggle Voice TTS"
description = "Activer ou désactiver la synthèse vocale pour ce volet Herdr"
command = ["node", "dist/index.js", "toggle"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "dist/index.js", "event"]

[[events]]
on = "pane.focused"
command = ["node", "dist/index.js", "event"]
