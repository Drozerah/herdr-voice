# ==============================================================================
# Fichier de Configuration Déclaratif : herdr-plugin.toml
# Schéma IETF JSON Schema : schemas/herdr-plugin.schema.json
# ==============================================================================

[plugin]
name = "herdr-voice"
version = "1.0.0-alpha.1"
enabled = true # Interrupteur principal (true = actif, false = désactivé sans désinstaller)

[server]
endpoint = "http://127.0.0.1:8888/v1/audio/speech"
api_key = "" # Renseigner votre clé d'API si vous utilisez un service tiers sécurisé (ex: sk-...)
model = "mlx-kokoro"
voice = "Thomas"
speed = 1.0 # Vitesse d'élocution (0.25 à 4.0)
response_format = "aiff" # Format audio binaire (aiff, pcm, mp3, opus, aac, flac)

# Gardes-fous de Sécurité & Protection contre l'emballement des agents IA
max_input_length = 1000 # Caractères max par inférence (évite les factures et la surchauffe)
max_requests_per_minute = 10 # Disjoncteur automatique contre les boucles d'inférence infinies

[audio]
sample_rate = 24000 # Fréquence d'échantillonnage 24 kHz (Kokoro-82M)
channels = 1 # 1 = Mono, 2 = Stéréo
high_water_mark = 16384 # Limite de contre-pression RAM en octets (16 KB) pour @audio/speaker

# En-têtes HTTP personnalisés supplémentaires pour serveurs d'inférence tiers
[extra_headers]
# "OpenAI-Organization" = "org-123456789"

# Paramètres JSON supplémentaires pour serveurs d'inférence tiers (Standard OpenAI SDK extra_body)
[extra_body]
# stability = 0.75
