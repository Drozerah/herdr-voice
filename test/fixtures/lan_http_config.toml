# Security test fixture: Unencrypted HTTP endpoint on private LAN IP
[plugin]
name = "herdr-voice"
version = "1.0.0-alpha.1"
enabled = true

[server]
endpoint = "http://192.168.1.50:8888/v1/audio/speech"
api_key = "test-key"
model = "mlx-kokoro"
